name: independent checkpoint research tests
on:
  push:
  pull_request:
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go build and vet
        run: go build -o /tmp/kvbench ./go-bench && go vet ./go-bench
      - name: Install simulation dependencies
        run: pip install -r requirements.txt
      - name: Snapshot property/fault tests
        run: python -m unittest discover -s tests -v
      - name: Local Go smoke test
        run: go run ./go-bench -mib 8 -churn 0.01 -out /tmp/smoke.json
      - name: Verify smoke result
        run: python -c 'import json; a=json.load(open("/tmp/smoke.json")); assert all(r["recovery_correct"] for r in a)'
